[package]
name = "peatlink-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
peat-mesh = { version = "0.7", features = ["automerge-backend"] }
iroh = "0.97"
iroh-gossip = "0.97"
automerge = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
bytes = "1"
blake3 = "1"
hex = "0.4"
futures-util = "0.3"
rand = "0.9"
